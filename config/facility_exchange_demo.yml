# Scenario identity and reproducibility.
project:
  scenario_id: "facility_exchange_demo" # Filesystem-safe scenario label.
  random_seed: 20260711 # Seed used by all development simulations.

# Input provenance: simulated development inputs or user-supplied CSV files.
inputs:
  mode: "simulated" # Allowed values: simulated or files.
  facilities_file: null # Required CSV path when mode is files.
  observations_file: null # Required CSV path when mode is files.

# Synthetic network and normalized observation settings.
simulation:
  n_facilities: 120 # Total simulated facilities.
  n_positive_facilities: 24 # Facilities with a positive primary observation.
  n_negative_facilities: 88 # Facilities with a negative primary observation.
  n_unknown_facilities: 8 # Facilities with an unknown primary observation.
  observation_start: "2020-05-01" # First allowed observation date (ISO date).
  observation_end: "2020-06-15" # Last allowed observation date (ISO date).
  clustered_locations: true # Generate spatial clusters rather than uniform points.
  minimum_spacing_m: 250 # Target minimum separation during point generation.

# Study extent and spatial output resolution.
domain:
  center_longitude: -89.031407 # Domain center longitude (EPSG:4326).
  center_latitude: 32.494830 # Domain center latitude (EPSG:4326).
  extent_km: 60 # Width and height of the square study domain.
  raster_resolution_m: 250 # Planned concentration-raster cell size.

# Duration-driven HYSPLIT and downstream analysis settings.
plume:
  maximum_evaluation_distance_km: 20 # Analysis filter; not a HYSPLIT stopping rule.
  computational_buffer_km: 5 # Extra computational context beyond evaluation distance.
  simulation_duration_hours: 8 # Forward atmospheric simulation duration.
  release_duration_hours: 1 # Duration of each source release.
  release_interval_hours: 6 # Spacing between candidate release times.
  planned_release_times: # Four UTC releases used to construct (not execute) runs.
    - "2020-05-01T00:00:00Z"
    - "2020-05-01T06:00:00Z"
    - "2020-05-01T12:00:00Z"
    - "2020-05-01T18:00:00Z"
  source_height_m: 5 # Default release height above ground.
  emission_mode: "unit" # Unit/specified emissions, separate from epidemiological models.
  emission_rate: 1 # Development emission rate.
  particle_diameter_um: 2.5 # Particle aerodynamic diameter.
  particle_density_g_cm3: 1.5 # Particle density.
  particle_shape_factor: 0.9 # Particle shape factor from 0 to 1.

# Generic atmospheric-tracer persistence after release.
tracer_decay:
  enabled: true # Apply a viability model to later exposure products.
  model: "exponential" # Supported initial decay model.
  half_life_hours: 2 # Exponential-decay half-life.
  minimum_fraction: 0.05 # Fractions below this may be set to zero.

# Receptor extraction and retained measurement settings.
exposure:
  receptor_buffer_m: 500 # Radius used for receptor-area extraction.
  sampling_method: "buffer" # Initial receptor sampling method: point or projected buffer.
  intercept_metric: "particle_count" # Continuous raster metric used for derived contact classification.
  intercept_threshold: 1 # A sampled value at or above this threshold meets the contact rule.
  minimum_intercept_hours: 1 # Minimum number of threshold-meeting hourly bins.
  cumulative_method: "sum" # Sum hourly summaries without hidden temporal units.
  include_source_as_receptor: false # Exclude the emitting facility from receptor records.
  retain_non_intercepts: true # Retain explicit zero, unavailable, and screened receptor records.

# HYSPLIT inputs and run workspace. Runs remain duration-driven.
hysplit:
  direction: "forward" # Forward source-to-receptor transport.
  meteorology_type: "reanalysis" # Intended meteorological product family.
  meteorology_directory: "local/facility_exchange_demo/climate" # Local met-data cache.
  hysplit_install_directory: null # Optional directory containing hycs_std and parhplot; splitr's bundled binaries are the default.
  allow_meteorology_download: false # Production/demo graph never downloads implicitly.
  verify_meteorology_after_download: true
  meteorology_download_timeout_seconds: 1800
  meteorology_download_retries: 2
  meteorology_lock_timeout_seconds: 60
  require_manifest_meteorology_ready: true
  meteorology_inventory_filename: "meteorology_inventory.csv"
  run_root_directory: "local/facility_exchange_demo/hysplit" # Parent for deterministic per-run directories.
  clean_up: false # Retain intermediates while developing the adapter.

# All generated products are kept below ignored local/ paths.
outputs:
  root_directory: "local/facility_exchange_demo" # Scenario output root.
  manifest_directory: "local/facility_exchange_demo/manifests" # Planned-run tables.
  raster_directory: "local/facility_exchange_demo/rasters" # Future plume rasters.
  exposure_directory: "local/facility_exchange_demo/exposures" # Exchange tables.
  report_directory: "local/facility_exchange_demo/reports" # Rendered local reports.

# Multi-run aggregation settings; this stage never executes HYSPLIT.
multirun:
  continue_on_error: true # Record an individual failure and continue processing other parsed runs.
  include_outside_distance_in_denominator: false # Candidate denominators use only receptors within the evaluation radius.
  time_units: ["release", "day", "week", "month"] # Connectivity summary periods.
  matrix_values: ["intercept_frequency", "n_intercept_runs", "total_particle_count_cumulative"] # Directed matrix products.

# Safe targets workflow controls. HYSPLIT execution is defined separately.
pipeline:
  parse_completed_runs: true # Parse completed run metadata when no portable parsed object exists.
  extract_receptors: true # Extract facility receptors from successful parsed branches.
  assemble_multirun: true # Assemble successful exchange branches.
  write_intermediate_outputs: true # Persist portable parsed and receptor products.
  continue_on_error: true # Capture independent branch errors rather than aborting unrelated work.
  targets_store: "local/facility_exchange_demo/targets" # Ignored scenario-specific targets store.
  status_directory: "local/facility_exchange_demo/pipeline_status" # Ignored status and report products.
